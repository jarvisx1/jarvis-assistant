<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030916">
<title>J.A.R.V.I.S. — Kişisel Asistan</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:radial-gradient(circle at 50% 35%,#08213a 0,#030916 58%);color:#8cecff;
font-family:Arial,sans-serif;text-align:center;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:480px;padding:24px 20px 30px}
h1{letter-spacing:7px;font-size:27px;margin:12px 0}
#status{color:#65a9d5;font-size:12px;letter-spacing:3px}
.reactor{width:210px;height:210px;margin:28px auto;border:2px solid #27cfff;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 25px #078ccf,inset 0 0 25px #078ccf}
.reactor:before,.reactor:after{content:"";position:absolute;border:1px solid #36cfff;border-radius:50%}
.reactor:before{inset:18px}.reactor:after{inset:40px}
.core{width:65px;height:65px;border-radius:50%;background:#b8faff;box-shadow:0 0 35px #18cfff}
.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 45px #28dfff}}
#log{min-height:54px;line-height:1.5;color:#d4f8ff;margin:10px 0 16px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #168cba;background:#09182a;color:white;font-size:16px;outline:none}
input:focus{border-color:#8cecff;box-shadow:0 0 0 2px #168cba55}
button{padding:12px 16px;margin:7px 3px;border-radius:22px;border:1px solid #29cfff;background:#082743;color:#9cefff;font-size:14px;cursor:pointer}
button:active{background:#12638a}
button:focus-visible{outline:2px solid white;outline-offset:2px}
.small{color:#6488a6;font-size:12px;line-height:1.5}
.panel{margin:20px 0 0;padding:14px;border:1px solid #145273;border-radius:14px;background:#061426cc;text-align:left}
.panel h2{font-size:13px;letter-spacing:2px;margin:0 0 10px;color:#8cecff}
#taskList,#memoryList{padding-left:20px;margin:0;color:#c9f5ff;font-size:14px;line-height:1.7}
#taskList li.done{text-decoration:line-through;opacity:.55}
.hidden{display:none}
.footer{margin-top:18px;color:#6488a6;font-size:10px;letter-spacing:2px}
@media(max-width:360px){.reactor{width:180px;height:180px}h1{font-size:23px;letter-spacing:5px}main{padding:18px 14px}}
</style>
</head>
<body>
<main>
  <div id="status">SYSTEM ONLINE</div>
  <h1>J.A.R.V.I.S.</h1>
  <div class="reactor" id="reactor" aria-label="JARVIS sistem göstergesi"><div class="core"></div></div>
  <div id="log" aria-live="polite">JARVIS hazır. Size nasıl yardımcı olabilirim?</div>
  <p><input id="cmd" autocomplete="off" placeholder="Jarvis'e bir komut yaz..." aria-label="JARVIS komutu"></p>
  <button id="sendBtn">GÖNDER</button>
  <button id="listenBtn">🎙 KONUŞ</button>
  <button id="helpBtn">KOMUTLAR</button>

  <section class="panel">
    <h2>GÖREVLERİM</h2>
    <ol id="taskList"><li class="small">Henüz görev eklenmedi.</li></ol>
    <div class="small">Örnek: “Görev ekle yarın bilgisayarı güncelle”</div>
  </section>
  <section class="panel">
    <h2>JARVIS HAFIZASI</h2>
    <ul id="memoryList"><li class="small">Henüz kaydedilmiş bilgi yok.</li></ul>
    <div class="small">Örnek: “Hatırla en sevdiğim renk mavi”</div>
  </section>
  <div class="footer">MARK 2 · PERSONAL ASSISTANT</div>
</main>
<script>
const log=document.getElementById('log');
const cmd=document.getElementById('cmd');
const reactor=document.getElementById('reactor');
const statusEl=document.getElementById('status');
const taskListEl=document.getElementById('taskList');
const memoryListEl=document.getElementById('memoryList');

const TASK_KEY='jarvis_tasks_v2';
const MEMORY_KEY='jarvis_memory_v2';
let tasks=loadJSON(TASK_KEY,[]);
let memories=loadJSON(MEMORY_KEY,[]);

function loadJSON(key,fallback){
  try{const v=JSON.parse(localStorage.getItem(key));return Array.isArray(v)?v:fallback;}
  catch(e){return fallback;}
}
function saveJSON(key,value){
  try{localStorage.setItem(key,JSON.stringify(value));return true;}
  catch(e){return false;}
}
function normalize(s){return s.toLocaleLowerCase('tr-TR').replace(/[.!?]+$/,'').trim();}
function renderTasks(){
  taskListEl.innerHTML='';
  if(!tasks.length){taskListEl.innerHTML='<li class="small">Henüz görev eklenmedi.</li>';return;}
  tasks.forEach((task,i)=>{
    const li=document.createElement('li');
    li.className=task.done?'done':'';
    li.textContent=(i+1)+'. '+task.text+(task.done?' — tamamlandı':'');
    taskListEl.appendChild(li);
  });
}
function renderMemories(){
  memoryListEl.innerHTML='';
  if(!memories.length){memoryListEl.innerHTML='<li class="small">Henüz kaydedilmiş bilgi yok.</li>';return;}
  memories.slice(-8).forEach((item)=>{
    const li=document.createElement('li');li.textContent=item;memoryListEl.appendChild(li);
  });
}
function speak(text){
  log.textContent=text;
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='tr-TR';utterance.rate=0.96;utterance.pitch=0.88;
  const voices=window.speechSynthesis.getVoices();
  const trVoices=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('tr'));
  // Turkish male voices are not labeled consistently; prefer a voice whose name suggests a male voice.
  const male=trVoices.find(v=>/male|erkek|ahmet|mehmet|cem|burak|tolga/i.test(v.name));
  if(male)utterance.voice=male;else if(trVoices.length)utterance.voice=trVoices[0];
  window.speechSynthesis.speak(utterance);
}
function addTask(text){
  const clean=text.trim().replace(/^[\s:,-]+/,'');
  if(!clean){speak('Eklemek istediğiniz görevi de söyleyin. Örneğin, görev ekle yarın alışveriş yap.');return;}
  tasks.push({text:clean,done:false,createdAt:new Date().toISOString()});
  const saved=saveJSON(TASK_KEY,tasks);renderTasks();
  speak(saved?'Görev listenize eklendi: '+clean:'Görev eklendi ancak tarayıcı hafızasına kaydedilemedi.');
}
function completeTask(n){
  if(!tasks.length){speak('Tamamlanacak bir göreviniz yok.');return;}
  const idx=Number(n)-1;
  if(!Number.isInteger(idx)||idx<0||idx>=tasks.length){speak('Bu numarada bir görev bulamadım. Görevlerimi söyleyerek listeyi görebilirsiniz.');return;}
  tasks[idx].done=true;saveJSON(TASK_KEY,tasks);renderTasks();
  speak('Görev tamamlandı: '+tasks[idx].text);
}
function handle(qOriginal){
  const original=qOriginal.trim();
  const q=normalize(original);
  if(!q)return;
  if(/^(yardım|komutlar|neler yapabilirsin)$/.test(q)||q.includes('hangi komut')){
    speak('Saat, tarih, görev ekle, görevlerimi göster, görev tamamla 1, hatırla ve ne hatırlıyorsun komutlarını kullanabilirsiniz.');
  }else if(q.includes('görev ekle')||q.includes('görev oluştur')||q.includes('listeye ekle')){
    const m=original.match(/(?:görev(?:\s+ekle|\s+oluştur)|listeye\s+ekle)\s*[:,-]?\s*(.*)/i);
    addTask(m?m[1]:'');
  }else if(q.includes('görevlerimi')||q.includes('görev listesi')||q==='görevler'||q.includes('görevleri göster')){
    const open=tasks.filter(t=>!t.done);
    if(!tasks.length)speak('Henüz bir göreviniz yok. Görev ekle komutuyla yeni görev oluşturabilirsiniz.');
    else if(!open.length)speak('Tüm görevleriniz tamamlanmış. Harika iş!');
    else speak('Tamamlanmamış '+open.length+' göreviniz var: '+open.map((t,i)=>(i+1)+', '+t.text).join('. '));
  }else if(q.includes('görev tamamla')||q.includes('görevi tamamla')){
    const m=q.match(/(?:görev(?:i)?\s+tamamla)\s*(\d+)/);
    completeTask(m?m[1]:NaN);
  }else if(q.includes('tamamlanan görevleri sil')){
    tasks=tasks.filter(t=>!t.done);saveJSON(TASK_KEY,tasks);renderTasks();speak('Tamamlanan görevler silindi.');
  }else if(q.includes('tüm görevleri sil')||q.includes('görevleri temizle')){
    tasks=[];saveJSON(TASK_KEY,tasks);renderTasks();speak('Tüm görevler silindi.');
  }else if(q.startsWith('hatırla ')||q.startsWith('hafızaya kaydet ')){
    const fact=original.replace(/^(hatırla|hafızaya kaydet)\s*/i,'').trim();
    if(!fact){speak('Kaydetmemi istediğiniz bilgiyi söyleyin.');return;}
    memories.push(fact);const saved=saveJSON(MEMORY_KEY,memories);renderMemories();
    speak(saved?'Tamam, bunu bu cihazdaki JARVIS hafızasına kaydettim.':'Bilgiyi aldım ancak tarayıcı hafızasına kaydedemedim.');
  }else if(q.includes('ne hatırlıyorsun')||q.includes('hafızam')||q.includes('hatırladıkların')){
    speak(memories.length?'Hafızamda '+memories.length+' bilgi var: '+memories.slice(-5).join('. '):'Şu an hafızamda kayıtlı bilgi yok. Hatırla komutuyla bilgi kaydedebilirsiniz.');
  }else if(q.startsWith('hafızayı temizle')||q.startsWith('tüm hafızayı sil')){
    memories=[];saveJSON(MEMORY_KEY,memories);renderMemories();speak('Kaydedilmiş hafıza bilgileri silindi.');
  }else if(q.includes('saat')){
    speak('Şu an saat '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+'.');
  }else if(q.includes('tarih')||q.includes('bugün günlerden')){
    speak('Bugünün tarihi '+new Date().toLocaleDateString('tr-TR',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'.');
  }else if(q.includes('adın')){
    speak('Ben JARVIS. Kişisel asistanınız.');
  }else if(q.includes('nasılsın')){
    speak('Tüm sistemler çalışır durumda. Size yardımcı olmaya hazırım.');
  }else if(q.includes('merhaba')||q==='selam'){
    speak('Merhaba. JARVIS sistemleri hazır.');
  }else{
    speak('Komutunuzu aldım ancak bu ücretsiz sürümde henüz genel amaçlı yapay zekâ bağlantısı bulunmuyor. Desteklenen komutları görmek için komutlar diyebilirsiniz.');
  }
}
function ask(){const value=cmd.value.trim();if(!value)return;cmd.value='';handle(value);}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){speak('Bu tarayıcı ses tanımayı desteklemiyor. Lütfen komutunuzu yazın.');return;}
  const r=new SR();r.lang='tr-TR';r.interimResults=false;r.maxAlternatives=1;
  reactor.classList.add('listening');statusEl.textContent='DİNLİYOR';
  r.onresult=e=>{const transcript=e.results[0][0].transcript;cmd.value=transcript;ask();};
  r.onerror=()=>{log.textContent='Mikrofon iznini ve internet bağlantısını kontrol edin.';};
  r.onend=()=>{reactor.classList.remove('listening');statusEl.textContent='SYSTEM ONLINE';};
  try{r.start();}catch(e){speak('Mikrofon şu anda kullanılamıyor. Birkaç saniye sonra tekrar deneyin.');}
}
document.getElementById('sendBtn').addEventListener('click',ask);
document.getElementById('listenBtn').addEventListener('click',listen);
document.getElementById('helpBtn').addEventListener('click',()=>speak('Komutlar: saat, tarih, görev ekle, görevlerimi göster, görev tamamla 1, hatırla en sevdiğim renk mavi, ne hatırlıyorsun.'));
cmd.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
renderTasks();renderMemories();
if('speechSynthesis' in window){window.speechSynthesis.onvoiceschanged=()=>{};}
</script>
</body>
</html>
